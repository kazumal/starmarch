<title>Starmarch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
<style>
/* Layout: realm status strip on top; the galaxy map fills the stage; a command sidebar (right on desktop, below on phones) shows the realm or the focused planet plus war news */
:root{
  --space:#070b22; --deep:#0f1640; --panel:rgba(13,19,52,.95); --line:#27326b; --ink:#e7ecff; --mute:#8d97c7;
  --player:#7fd6ff; --gold:#ffe08a; --dust:#ff9de6; --heal:#7ff0b0; --warn:#ff5c8a;
  --display:'Chakra Petch','Zen Kaku Gothic New',system-ui,sans-serif;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--space);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;margin:0}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.stat{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.stat small{font-size:10px;letter-spacing:.14em;color:var(--mute);font-family:var(--display)}
.stat b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;font-weight:700}
.stat b em{font-style:normal;font-size:11px;color:var(--heal);margin-left:4px}
.stat b.over{color:var(--warn)}
#sDay b{color:var(--player)} #sCr b{color:var(--gold)}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button,.btn{font-family:var(--display);font-size:13px;font-weight:700;color:var(--mute);background:transparent;border:0;padding:7px 10px;cursor:pointer;letter-spacing:.04em;position:relative}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--player);color:var(--space)}
#speed button[data-s="0"][aria-pressed="true"]{background:var(--gold)}
.btn{border:1px solid var(--line);border-radius:6px}
.btn:hover,.seg button:hover{color:var(--ink)}
.btn .dot{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:8px;background:var(--gold);color:#0b102e;font-size:10px;display:grid;place-items:center;padding:0 3px;box-sizing:border-box}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.main{flex:1;min-height:0;display:flex;gap:8px}
.stage{position:relative;flex:1;min-width:0;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--deep)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.pausetag{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:12px;letter-spacing:.2em;color:#0b102e;background:var(--gold);padding:4px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
.coal{position:absolute;top:10px;right:10px;font-size:12px;font-weight:900;color:#fff;background:var(--warn);padding:4px 10px;border-radius:6px;pointer-events:none}
aside{width:310px;flex:0 0 auto;display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px;box-sizing:border-box}
.ratio{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute)}
.info{display:flex;flex-direction:column;gap:10px}
.ph{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ph h3{margin:0;font-size:19px;font-weight:900}
.chip{font-size:11px;border-radius:999px;padding:2px 8px;border:1px solid currentColor;font-family:var(--display);letter-spacing:.06em;white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.kv div{background:var(--deep);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:1px}
.kv small{font-size:10px;color:var(--mute);letter-spacing:.08em}
.kv b{font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.lv{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.lv i{width:12px;height:6px;border-radius:2px;background:var(--line)}
.lv i.on{background:var(--player)}
.trait{background:color-mix(in srgb,var(--gold) 12%,var(--deep));border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5}
.trait b{color:var(--gold)}
.builds{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bb{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:7px 8px;color:var(--ink);cursor:pointer;font-family:var(--body);font-size:13px;font-weight:700}
.bb small{font-family:var(--display);font-size:11px;color:var(--gold);font-weight:500}
.bb:disabled{opacity:.38;cursor:default}
.bb:not(:disabled):hover{border-color:var(--player)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--gold)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink);cursor:pointer;font-family:var(--body);font-weight:700;text-align:left;width:100%;box-sizing:border-box}
.toggle small{font-weight:400;color:var(--mute);display:block;font-size:11px}
.toggle span.sw{flex:0 0 auto;width:34px;height:18px;border-radius:9px;background:var(--line);position:relative}
.toggle span.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--mute);transition:left .15s}
.toggle:disabled{opacity:.4;cursor:default}
.toggle.on span.sw{background:var(--player)}.toggle.on span.sw::after{left:18px;background:#0b102e}
.off-list{display:flex;flex-direction:column;gap:6px}
.off{background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:5px}
.off .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-weight:900;font-size:13px;color:#0b102e;flex:0 0 auto}
.off .nm{font-weight:900;font-size:13px;flex:1;min-width:0}
.off .st{font-family:var(--display);font-size:11px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.off .st b{color:var(--ink);font-weight:500}
.off select{font-family:var(--body);font-size:12px;background:#0b102e;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px;max-width:100%}
.hire{font-family:var(--body);font-size:12px;font-weight:700;background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:5px 10px;cursor:pointer}
.hire:disabled{opacity:.4;cursor:default}
.sec{font-family:var(--display);font-size:11px;letter-spacing:.18em;color:var(--mute);margin:0}
.facs{display:flex;flex-direction:column;gap:5px}
.fac{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;font-size:12px}
.fac i{width:10px;height:10px;border-radius:50%}
.fac span{font-family:var(--display);color:var(--mute);font-variant-numeric:tabular-nums}
.roles{display:flex;flex-direction:column;gap:4px;font-size:12px}
.roles div{display:flex;justify-content:space-between;gap:8px;background:var(--deep);border-radius:6px;padding:5px 8px}
.roles span{color:var(--mute)}
.pols{display:flex;flex-direction:column;gap:8px}
.pol{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;font-size:12px}
.pol>span{font-weight:700}.pol .seg{justify-self:end}.pol .seg button{padding:5px 8px;font-size:12px;font-family:var(--body)}
.pol small{grid-column:1/-1;color:var(--mute);font-size:11px;line-height:1.4}
.alert{background:color-mix(in srgb,var(--warn) 16%,var(--deep));border:1px solid var(--warn);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.55}
.alert b{color:var(--warn);display:block;font-size:13px}.alert .go{margin-top:4px}
.opb{display:flex;flex-direction:column;gap:2px;font-size:12px;background:#0b102e;border-radius:6px;padding:6px 8px}
.opb div{display:flex;justify-content:space-between;gap:8px}.opb span{color:var(--mute)}.opb b{font-family:var(--display);font-weight:500}
.opb .sub{display:block;color:var(--mute);font-size:11px;line-height:1.45;margin-bottom:3px}
.queue{display:flex;flex-direction:column;gap:4px}
.qi{display:flex;align-items:center;gap:8px;background:var(--deep);border-radius:6px;padding:5px 8px;font-size:12px}
.qi span{flex:1}.qi em{font-style:normal;color:var(--gold);font-size:11px}.qi .prog{flex:1}
.qi.now span{flex:0 0 auto;font-weight:700}
.go{font-family:var(--body);font-size:12px;font-weight:700;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 9px;cursor:pointer}
.go:hover{border-color:var(--player)}
.gauge{height:8px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--heal)}
.gauge.over i{background:var(--warn)}
.news{display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:1.45;margin-top:auto;border-top:1px solid var(--line);padding-top:8px}
.news b{font-family:var(--display);font-weight:500;color:var(--mute);opacity:.6;margin-right:6px}
.hint{font-size:13px;color:var(--mute);line-height:1.65;margin:0}
.hint b{color:var(--ink)}
[hidden]{display:none!important}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,8,26,.78);padding:16px;overflow:auto;z-index:5}
.panel{width:min(680px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.panel h1{font-family:var(--display);font-size:clamp(34px,8vw,58px);line-height:1;margin:0;letter-spacing:.06em;background:linear-gradient(90deg,var(--player),#b38cff 55%,var(--warn));-webkit-background-clip:text;background-clip:text;color:transparent}
.panel h2{font-family:var(--display);font-size:24px;margin:0;letter-spacing:.04em;text-wrap:balance}
.kicker{font-family:var(--display);font-size:12px;letter-spacing:.24em;color:var(--mute);margin:0}
.panel p{margin:0;line-height:1.7}
.muted{color:var(--mute);font-size:14px}
.rules{margin:0;padding-left:1.2em;line-height:1.8}
.rules b{color:var(--player)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cta{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.1em;background:var(--player);color:var(--space);border:0;border-radius:8px;padding:13px 20px;cursor:pointer;flex:1}
.cta.alt{background:transparent;color:var(--dust);border:1px solid var(--dust)}
.cta.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.cta:disabled{opacity:.4;cursor:default}
.tally{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-variant-numeric:tabular-nums;font-family:var(--display);margin:0}
.tally dt{color:var(--mute)} .tally dd{margin:0;text-align:right}
.tally .total{color:var(--gold);font-size:20px} .tally .dust{color:var(--dust);font-size:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--deep)}
.item strong{font-family:var(--display);font-size:15px}
.item span{font-size:13px;color:var(--mute);line-height:1.5}
.pips{display:flex;gap:4px}.pips i{width:16px;height:5px;border-radius:2px;background:var(--line)}.pips i.on{background:var(--dust)}.pips.t i.on{background:var(--gold)}
.buy{font-family:var(--display);font-weight:700;font-size:13px;background:transparent;color:var(--dust);border:1px solid var(--dust);border-radius:6px;padding:7px 10px;cursor:pointer;align-self:flex-start}
.buy.t{color:var(--gold);border-color:var(--gold)}
.buy:disabled{opacity:.35;cursor:default}
.dip{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dip b{font-size:15px}.dip small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
@media (max-width:860px) and (orientation:portrait){
  .main{flex-direction:column}
  aside{width:auto;max-height:38%;flex:0 0 auto}
  .stage{flex:1 1 auto;min-height:200px}
  .stat b{font-size:15px}.hud{gap:4px 10px}.seg button,.btn{padding:6px 7px;font-size:12px}.panel{padding:16px}
}
#bSide{display:none}
/* phones held sideways: the command panel becomes a drawer over the map so the map keeps the full height */
@media (max-height:520px) and (orientation:landscape){
  #app{gap:4px;padding-top:max(4px,env(safe-area-inset-top,0px));padding-bottom:max(4px,env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .hud{flex-wrap:nowrap;gap:4px 10px}
  .stat small{display:none}.stat b{font-size:14px}.stat b em{font-size:10px}
  .seg button,.btn{padding:6px 9px;font-size:12px}
  .main{position:relative}
  aside{max-height:none;position:absolute;top:0;right:0;bottom:0;width:min(340px,56vw);z-index:6;transform:translateX(calc(100% + 16px + env(safe-area-inset-right,0px)));visibility:hidden;transition:transform .18s ease;box-shadow:-10px 0 28px rgba(0,0,0,.55)}
  body.side-open aside{transform:none;visibility:visible}
  #bSide{display:inline-block}
  .panel{padding:14px;gap:10px}.panel h1{font-size:34px}.rules{font-size:13px;line-height:1.6;max-height:38vh;overflow-y:auto;padding-right:6px}
}
@media (max-width:860px) and (orientation:portrait){#app{padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <div class="hud">
    <div class="stat" id="sDay"><small>銀河-宇宙暦</small><b id="hDay">-</b></div>
    <div class="stat" id="sCr"><small>資金</small><b id="hCr">-</b></div>
    <div class="stat"><small>統治 惑星/上限</small><b id="hPl">-</b></div>
    <div class="stat"><small>総艦数/維持上限</small><b id="hShips">-</b></div>
    <div class="stat"><small>SCORE</small><b id="hScore">0</b></div>
    <div class="spacer"></div>
    <div class="seg" id="speed" role="group" aria-label="時間の速さ">
      <button data-s="0" aria-pressed="false" title="一時停止 (Space)">II</button>
      <button data-s="1" aria-pressed="true">×1</button>
      <button data-s="2" aria-pressed="false">×2</button>
      <button data-s="3" aria-pressed="false">×3</button>
    </div>
    <button class="btn" id="bTech">技術</button>
    <button class="btn" id="bHome" title="首都へ (H)">⌂</button>
    <button class="btn" id="bSide" aria-label="指揮パネルを開く">指揮</button>
    <button class="btn" id="bMute">♪</button>
    <button class="btn" id="bMenu">≡</button>
  </div>
  <div class="main">
    <div class="stage">
      <canvas id="cv"></canvas>
      <div class="pausetag" id="pauseTag" hidden>PAUSED · 停止中も命令できます</div>
      <div class="coal" id="coalTag" hidden>対自軍包囲網</div>
      <div class="overlay" id="ov"></div>
    </div>
    <aside id="side">
      <div class="ratio"><span>出撃させる割合</span>
        <div class="seg" id="ratio" role="group" aria-label="出撃させる割合">
          <button data-r="0.25" aria-pressed="false">25%</button><button data-r="0.5" aria-pressed="true">50%</button><button data-r="0.75" aria-pressed="false">75%</button><button data-r="1" aria-pressed="false">全</button>
        </div></div>
      <div class="info" id="info"></div>
      <div class="news" id="news"></div>
    </aside>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),ov=$('ov');
const FACS={
  p:{name:'自軍',col:'#7fd6ff'},
  raid:{name:'レイダー',col:'#ff5c8a',aggr:1.3,dev:.5},
  hive:{name:'ハイヴ',col:'#b38cff',aggr:1.0,dev:.9},
  bastion:{name:'バスティオン',col:'#ffb347',aggr:.75,dev:1.3},
  verd:{name:'ヴェルド連邦',col:'#6ff0a8',aggr:.9,dev:1.1},
  iron:{name:'鉄鎖帝国',col:'#e8dcae',aggr:1.15,dev:.8},
  void:{name:'虚空の軍勢',col:'#3df0d8',aggr:1.5,dev:.3},
  rebel:{name:'独立軍',col:'#ff9df0',aggr:1.0,dev:.8},
  n:{name:'中立',col:'#6f789c'},
};
const AI_ORDER=['raid','hive','bastion','verd','iron'];
const TRAITS={
  ruins:{name:'古代遺跡',k:'遺',desc:'技術開発の費用 -15%'},
  forge:{name:'造船資源',k:'鋼',desc:'全惑星の生産 +8%'},
  trade:{name:'交易ハブ',k:'商',desc:'全惑星の資金収入 +15%'},
  fortress:{name:'要塞星',k:'塞',desc:'この惑星の防御 ×1.8・最大艦数 +40'},
  nexus:{name:'航路結節点',k:'結',desc:'全惑星の出撃射程 +8%'},
  academy:{name:'士官学校',k:'学',desc:'統治上限 +2・維持上限 +20'},
};
const BUILD={
  ind:{name:'産業開発',desc:'生産・収入・最大艦数アップ',cost:p=>50+40*p.ind,time:18,can:p=>p.ind<5},
  def:{name:'防衛強化',desc:'防御・最大艦数アップ',cost:p=>45+35*p.def,time:14,can:p=>p.def<4},
  turret:{name:'砲台',desc:'近づく敵艦隊を撃つ',cost:p=>p.owner==='p'&&G.doc==='fort'?45:90,time:16,can:p=>!p.turret},
  relay:{name:'中継塔',desc:'射程 ×1.5・発進艦隊 +25%速',cost:()=>70,time:14,can:p=>!p.relay},
  depot:{name:'補給基地',desc:'首都と同じく補給の起点になる',cost:()=>80,time:16,can:p=>!p.depot},
  gov:{name:'総督府',desc:'統治上限 +2。建てるほど高くなる',cost:p=>90+45*G.planets.filter(q=>q.owner===p.owner&&q.gov).length,time:20,can:p=>!p.gov},
};
const TECH=[
  {id:'gov',name:'統治機構',desc:'統治上限 +3',cost:[140,300,520,800]},
  {id:'prod',name:'自動工廠',desc:'全惑星の生産 +12%',cost:[150,300,520,800]},
  {id:'econ',name:'交易網',desc:'資金収入 +15%',cost:[120,260,450,700]},
  {id:'atk',name:'兵装',desc:'艦の攻撃力 +10%',cost:[160,320,560,850]},
  {id:'def',name:'装甲',desc:'惑星の防御 +10%',cost:[140,300,520,800]},
  {id:'speed',name:'推進機関',desc:'艦隊速度 +12%',cost:[120,260,450]},
  {id:'range',name:'航続距離',desc:'出撃射程 +10%',cost:[150,320,550]},
  {id:'build',name:'建設技術',desc:'建設の時間 -15%・費用 -10%',cost:[110,240,420]},
  {id:'logi',name:'兵站網',desc:'維持上限（維持費なしで持てる艦数）+15%',cost:[150,320,560]},
  {id:'sensor',brk:1,name:'深宇宙センサー',desc:'視界が自軍惑星から2つ先まで広がる。敵の集結や首都を早く見つけられる',cost:[380]},

  const up=isP?Math.max(0,fleet-fcap)*UPKEEP:0;
  return{cap,eff,n:pl,fcap:Math.round(fcap),fleet,up,broke:!!G.fac[fac]?.broke,
    prod:(fac==='void'?1.2:1)*(G.rule==='rich'?1.3:1)*eff*(G.fac[fac]?.broke?.5:1)*(1+.08*traitN(fac,'forge'))*(isP?(1+.04*meta.lv.prod)*(1+.12*T('prod'))*(G.doc==='fort'?.9:G.doc==='mass'?1.15:1):G.aiMul*aiX(fac)),

function genGalaxy(){
  const g=G.g,N=Math.min(28+6*(g-1),54);
  G.WW=Math.round(Math.sqrt(N*70000*1.6));G.WH=Math.round(G.WW/1.6);
  const P=[];let tries=0;
  while(P.length<N&&tries++<20000){const r=rnd(16,28),x=rnd(70,G.WW-70),y=rnd(70,G.WH-70);if(P.every(q=>Math.hypot(q.x-x,q.y-y)>150+q.r+r))P.push({x,y,r})}

  G.planets=P.map((q,i)=>({id:i,name:names[i%names.length],x:q.x,y:q.y,r:q.r,owner:'n',ships:Math.round(rnd(8,22)+g*3),garrison:0,ind:Math.random()<.3?2:1,def:Math.random()<.2?1:0,
    turret:false,relay:false,depot:false,hold:false,sup:0,build:null,queue:[],fx:{},auto:false,flash:0,capital:false,trait:null,type:pick(['rock','gas','ice','lava']),deco:Array.from({length:10},Math.random)}));
  const inT=[G.planets[0]],out=G.planets.slice(1);let bott=0;
  while(out.length){let bi=0,bd=1e9;out.forEach((o,i)=>{const d=Math.min(...inT.map(t=>dist(t,o)-o.r));if(d<bd){bd=d;bi=i}});bott=Math.max(bott,bd);inT.push(out.splice(bi,1)[0])}
  G.range=Math.max(320,bott*1.05);
  G.lanes=[];for(let i=0;i<G.planets.length;i++)for(let j=i+1;j<G.planets.length;j++)if(dist(G.planets[i],G.planets[j])<=G.range+G.planets[j].r)G.lanes.push([G.planets[i],G.planets[j]]);
  G.adj=G.planets.map(()=>[]);for(const [a,b] of G.lanes){G.adj[a.id].push(b);G.adj[b.id].push(a)}
  const k=g===1?3:g===2?4:5;const facs=['p',...shuffle(AI_ORDER.slice()).slice(0,k)];
  const homes=[G.planets.slice().sort((a,b)=>(a.x+a.y*.3)-(b.x+b.y*.3))[0]];
  while(homes.length<facs.length){let bp=null,bd=-1;for(const p of G.planets){if(homes.includes(p))continue;const d=Math.min(...homes.map(h=>dist(h,p)));if(d>bd){bd=d;bp=p}}homes.push(bp)}
  G.fac={};G.M={};G.rel={};G.coal=false;G.aiMul=1+.15*(g-1)+.06*Math.max(0,g-4)**1.6;
  facs.forEach((f,i)=>{
    const h=homes[i];Object.assign(h,{owner:f,ind:3,def:1,r:30,capital:true,ships:f==='p'?45:40+g*6});
    G.fac[f]={cr:f==='p'?0:80,tick:rnd(1,3),autoT:0,alive:true,offT:rnd(110,170)/(FACS[f].aggr||1),off:null};if(f!=='p')G.rel[f]={cease:0,cool:0};
    const extra=f==='p'?1:1+Math.floor((g-1)/2);
    G.planets.filter(p=>p.owner==='n').sort((a,b)=>dist(a,h)-dist(b,h)).slice(0,extra).forEach(p=>{p.owner=f;p.ships=18+g*3;p.ind=Math.max(p.ind,2)});
  });
  // special planets: strategic targets beyond raw planet count

/* ---------- actions ---------- */

}
function startBuild(p,k){

  const c=Math.round(B.cost(p)*(p.owner==='p'?Math.pow(.9,T('build')):1));if(F.cr<c)return false;
  F.cr-=c;p.build={k,t:0,dur:B.time*(p.owner==='p'?Math.pow(.85,T('build')):1)};
  if(p.owner==='p')tone(392,.1,'square',.025,200);return true;
}
function finishBuild(p){const k=p.build.k;p.build=null;if(k==='ind')p.ind++;else if(k==='def')p.def++;else if(k==='turret')p.turret=true;else if(k==='depot'){p.depot=true;computeSupply()}else if(k==='gov'){p.gov=true;refreshM()}else p.relay=true;
  p.flash=1;burst(p.x,p.y,col(p.owner),16,.8);if(p.owner==='p'){if(G.focus===p)news(`${p.name}：${BUILD[k].name}が完了`,'#ffe08a');tone(784,.08,'triangle',.02);tryQueue(p)}}

    news(`${t.name}を制圧${isAI(prev)?'（'+FACS[prev].name+'から奪取）':''}${t.trait?'：'+TRAITS[t.trait].name+'を獲得':''}`,'#7fd6ff')}

function arrive(f){
  const t=f.to;

  // pincer: hits from a different planet of the same side within 4s overwhelm the defenders
  t.hits=(t.hits||[]).filter(h=>G.t-h.t<4);let atk=f.atk;
  if(t.hits.some(h=>h.o===f.owner&&h.s!==f.src)){atk*=f.owner==='p'&&T('pincer')?1.8:1.35;if(f.n>=4)G.fx.push({x:t.x,y:t.y+16,txt:'挟撃',t:0,c:col(f.owner)})}
  t.hits.push({o:f.owner,s:f.src,t:G.t});

  if(f.owner==='p'&&t.owner!=='n')G.kills+=Math.min(dmg,t.ships);else if(t.owner==='p'&&f.owner!=='p')G.kills+=Math.min(f.n,t.ships*def/atk);burst(f.x,f.y,col(f.owner),Math.min(10,2+f.n/4),.6);

  if(dmg>t.ships){t.ships=(dmg-t.ships)*def/atk;capture(t,f.owner)}else t.ships-=dmg;

/* ---------- AI ---------- */
function aiTick(k){
  const F=FACS[k],S=G.fac[k],mine=G.planets.filter(p=>p.owner===k);if(!mine.length)return;
  const low=mine.find(p=>p.sup>0&&!p.depot&&!p.build);if(low&&S.cr>80&&Math.random()<.5)startBuild(low,'depot');
  if(S.cr>60&&Math.random()<.5+F.dev*.3){
    const front=mine.filter(p=>isFront(p)&&!p.build),back=mine.filter(p=>!isFront(p)&&!p.build);
    let p=null,b=null;
    if(back.length&&Math.random()<.5+F.dev*.2){p=back.filter(p=>p.ind<5).sort((a,b)=>a.ind-b.ind)[0];b='ind'}
    if(!p&&front.length){p=pick(front);b=!p.turret&&Math.random()<.4?'turret':p.def<4?'def':'ind'}
    if(p&&b)startBuild(p,b);
  }
  const sorted=mine.slice().sort((a,b)=>b.ships-a.ships),kk=1+Math.floor(mine.length/4),reserved=new Map(),cease=G.rel[k]?.cease>0;
  for(const s of sorted.slice(0,kk)){
    if(s.ships<15||(S.off&&S.off.stage===s))continue;
    const avail=s.ships*.65*Mof(k).atk;let bestT=null,bc=1e9;
    for(const t of G.planets){
      if(t.owner===k||!inRange(s,t)||(t.owner==='p'&&cease))continue;
      const travel=dist(s,t)/70,inc=(reserved.get(t)||0)+G.fleets.reduce((a,f)=>a+(f.to===t&&f.owner===k?f.n:0),0);
      const need=(t.ships+prodOf(t)*travel)*defOf(t)+3-inc;if(avail<need*(1.35-F.aggr*.15))continue;
      let c=dist(s,t)/6+need;
      if(t.owner==='p')c*=G.coal?.55:(G.g===1?1.2:1.05);else if(isAI(t.owner))c*=G.coal?3:1;else c*=.9;
      if(t.trait)c*=.8;if(t.capital)c*=.85;if(t.owner==='void')c*=.6;if(t.sup===2)c*=.8;if(G.hegT>0&&t.owner==='p'&&t.trait)c*=.4;
      if(c<bc){bc=c;bestT=t}
    }
    if(bestT){send(s,bestT,s.ships*.65,true);reserved.set(bestT,(reserved.get(bestT)||0)+avail)}
    else if(!isFront(s)&&s.ships>25)logistics(s);
  }
}
function logistics(s){
  const near=G.planets.filter(p=>p.owner===s.owner&&p!==s&&inRange(s,p));if(!near.length)return;
  const enemies=G.planets.filter(p=>p.owner!==s.owner);if(!enemies.length)return;
  const sc=p=>Math.min(...enemies.map(e=>dist(p,e)));
  const t=near.sort((a,b)=>sc(a)-sc(b))[0];if(sc(t)<sc(s))send(s,t,s.ships*.6,true);
}
function checkCoalition(){
  const nonN=G.planets.filter(p=>p.owner!=='n').length,mine=G.planets.filter(p=>p.owner==='p').length,ai=Object.keys(G.fac).filter(k=>isAI(k)&&G.fac[k].alive).length;

  else if(G.coal&&(share<(TR('coal')?.2:.3)||ai<2)){G.coal=false;news('包囲網が瓦解した','#ffe08a')}
  $('coalTag').hidden=!(G.coal&&G.mode==='play');

/* ---------- supply ---------- */
function computeSupply(){
  for(const p of G.planets){p.psup=p.sup;p.sup=p.owner==='n'?0:2}
  for(const k in G.fac){
    const d=new Map(),q=[];
    for(const p of G.planets)if(p.owner===k&&(p.capital||(p.depot&&!(k==='p'&&G.depotOff>0)))){d.set(p,0);q.push(p)}
    while(q.length){const c=q.shift(),dc=d.get(c);for(const n of G.adj[c.id]){if(n.owner!==k||d.has(n))continue;d.set(n,dc+1);q.push(n)}}
    for(const [p,h] of d)p.sup=h<=3?0:h<=5?1:2;
  }
  if(G.mode==='play'){const cut=G.planets.filter(p=>p.owner==='p'&&p.sup===2&&p.psup!==2);if(cut.length)news(`補給途絶：${cut.map(p=>p.name).join('、')}（補給基地を建てるか、首都とつなぎ直そう）`,'#ff5c8a')}
}

/* ---------- operations ---------- */
function opPath(target){
  const par=new Map(),q=[];for(const p of G.planets)if(p.owner==='p'){par.set(p,null);q.push(p)}
  while(q.length){const c=q.shift();if(c===target)break;for(const n of G.adj[c.id])if(!par.has(n)&&seen(n)){par.set(n,c);q.push(n)}}
  if(!par.has(target))return null;const path=[];let c=target;while(c){path.unshift(c);c=par.get(c)}return path;
}
function bfsOwn(base){const par=new Map([[base,null]]),dd=new Map([[base,0]]),q=[base];
  while(q.length){const c=q.shift();for(const n of G.adj[c.id])if(n.owner===base.owner&&!dd.has(n)){dd.set(n,dd.get(c)+1);par.set(n,c);q.push(n)}}return{dd,par}}
function newOp(t){if(G.ops.some(o=>o.target===t))return;if(G.ops.length>=opsMax()){G.toast={txt:`作戦は${opsMax()}つまで。どれかを中止しよう`,t:2.2};return}const op={id:G.opId++,target:t,stance:1,status:'準備中',ready:0,path:null};G.ops.push(op);opTick(op);news(`作戦${op.id}：${t.name}への攻勢を開始`,'#7fd6ff');tone(600,.12,'triangle',.03,300)}
// what we believe about a planet: live data if visible, the last sighting if it is in the fog
const intel=p=>vis(p)||!G.mem[p.id]?p:Object.assign(Object.create(p),G.mem[p.id]);
const travel=(a,b)=>Math.max(0,dist(a,b)-b.r)/(70*Mof('p').spd*(a.relay?1.25:1));
function opEstimate(op,front,base){
  const I=intel(front),est=I!==front,m=STANCE[op.stance].m;
  const spare=p=>isHold(p)?p.ships*.5:p.ships-5;
  const atk=G.planets.filter(p=>p.owner==='p'&&p.ships>8&&inRange(p,front)&&!G.launches.some(l=>l.p===p));
  const pw=atk.map(p=>spare(p)*Mof('p').atk*SUP_A[p.sup]).sort((a,b)=>b-a);
  const pinc=T('pincer')?1.8:1.35,pinBonus=pw.length>1?pw.slice(1).reduce((a,v)=>a+v,0)*(pinc-1):0;
  const power=pw.reduce((a,v)=>a+v,0)+pinBonus;
  const inc=G.fleets.reduce((a,f)=>a+(f.to===front&&f.owner==='p'?f.n*f.atk:0),0)+G.launches.filter(l=>l.to===front).reduce((a,l)=>a+spare(l.p)*Mof('p').atk,0);
  const stg=new Set(atk),trans=G.fleets.reduce((a,f)=>a+(f.owner==='p'&&stg.has(f.to)?f.n*Mof('p').atk:0),0);
  const tmax=atk.reduce((a,p)=>Math.max(a,travel(p,front)),travel(base,front));
  const enemy=Math.max(0,I.ships),grow=front.owner==='n'?0:prodOf(I)*tmax,df=defOf(I),tur=I.turret?6*Math.max(1,atk.length):0;
  const reinf=isAI(front.owner)?G.planets.filter(q=>q!==front&&q.owner===front.owner&&inRange(q,front)&&seen(q)).reduce((a,q)=>a+Math.max(0,intel(q).ships-15)*.4,0)*.6*df:0;
  const need=(enemy+grow)*df+tur+reinf+4;
  return{atk,power,inc,need,m,est,trans,reinf,enemy,grow,df,tur,pin:pinBonus,spare,ago:est?Math.floor(G.t-(G.mem[front.id].t||0)):0};
}
function opTick(op){
  if(op.target.owner==='p'){G.ops=G.ops.filter(o=>o!==op);news(`作戦${op.id}完了：${op.target.name}を確保`,'#7fd6ff');return}
  const path=opPath(op.target);op.path=path;
  if(!path||path.length<2){op.status='経路なし';op.ready=0;op.info=null;return}
  const base=path[0],front=path[1];op.base=base;op.front=front;
  const E=opEstimate(op,front,base);op.info=E;
  if(E.inc>=E.need*E.m){op.status='攻撃中';op.ready=1;return}
  op.ready=Math.min(1,(E.power+E.inc)/(E.need*E.m));
  // if we already beat the bare requirement and the gathering has stopped growing, don't wait for the stance margin forever
  const tot=E.power+E.inc;if(tot>(op.peak||0)*1.03+1){op.peak=tot;op.stall=0}else op.stall=(op.stall||0)+1;
  E.stallGo=tot>=E.need&&E.trans<E.need*.1?Math.max(0,8-op.stall):-1;
  if(op.force||(tot>=E.need*E.m||E.stallGo===0)&&E.power>0){op.force=false;op.peak=0;op.stall=0;
    if(!E.atk.length){op.status='突入できる惑星がない';return}
    // time the launches so every wave lands within the pincer window: farthest planets leave first
    const T0=Math.max(...E.atk.map(p=>travel(p,front)));
    for(const p of E.atk)G.launches.push({p,to:front,at:G.t+(T0-travel(p,front))*.9});
    op.status='攻撃中';if(front!==op.target)G.fx.push({x:front.x,y:front.y,txt:'突入',t:0,c:'#7fd6ff'})}
  else op.status=front===op.target?'集結中':`集結中（${front.name}経由）`;
}
function launchTick(){
  G.launches=G.launches.filter(l=>{if(G.t<l.at)return true;const p=l.p;if(p.owner==='p'&&l.to.owner!=='p'){const k=isHold(p)?p.ships*.5:p.ships-5;send(p,l.to,k,true)}return false});
}
// Rear transport: a flow field over our own territory toward the places that need ships.
// While operations run, everything flows to their staging planets; otherwise to the front line.
// Fleets skip ahead to the farthest planet on the route they can reach, so they don't stop at every hop.
// Hostile strength that could hit this planet (neutrals never attack). Front planets keep a garrison
// sized to it and release the rest, so production on quiet fronts no longer piles up unused.
function threatOf(p){let t=0;for(const q of G.planets)if(q.owner!=='p'&&q.owner!=='n'&&hostile('p',q.owner)&&inRange(q,p)&&seen(q))t=Math.max(t,intel(q).ships);return t}
function garrisonOf(p){if(!isFront(p))return 2;const t=threatOf(p);return t>0?Math.max(15,Math.round(t*.6/defOf(p))+10):8}
function flowTick(){
  const own=G.planets.filter(p=>p.owner==='p');if(!own.length)return;
  const staging=new Set();for(const op of G.ops)if(op.front)for(const p of own)if(inRange(p,op.front))staging.add(p);
  const fronts=own.filter(p=>isFront(p)),hot=fronts.filter(p=>threatOf(p)>0);
  const opsOn=staging.size>0,sinks=opsOn?staging:new Set(hot.length?hot:fronts);if(!sinks.size)return;
  const d=new Map(),par=new Map(),q=[];for(const s of sinks){d.set(s,0);q.push(s)}
  while(q.length){const c=q.shift();for(const n of G.adj[c.id])if(n.owner==='p'&&!d.has(n)){d.set(n,d.get(c)+1);par.set(n,c);q.push(n)}}
  for(const p of own){
    if(sinks.has(p)||isHold(p)||!d.has(p))continue;
    if(!isAuto(p)&&!(opsOn&&d.get(p)<=6))continue;
    const keep=garrisonOf(p);if(p.ships<keep+6)continue;
    let tgt=null;for(let c=par.get(p);c;c=par.get(c))if(inRange(p,c))tgt=c;
    if(tgt)send(p,tgt,p.ships-keep,true);
  }
}
// AI planets under a winning attack call for help from neighbours, so timing and pincers matter
function aiDefTick(){
  for(const p of G.planets){if(!isAI(p.owner)||(p.reinf||0)>G.t)continue;
    const inc=G.fleets.reduce((a,f)=>a+(f.to===p&&f.owner!==p.owner?f.n*f.atk:0),0);if(inc<10||inc<p.ships*defOf(p)*.8)continue;
    let sent=0;for(const n of G.planets)if(n!==p&&n.owner===p.owner&&n.ships>15&&inRange(n,p)&&!(G.fac[n.owner].off&&G.fac[n.owner].off.stage===n)){send(n,p,n.ships*.4,true);sent++}
    if(sent){p.reinf=G.t+6;if(vis(p)&&G.fleets.some(f=>f.to===p&&f.owner==='p'))G.fx.push({x:p.x,y:p.y-p.r-10,txt:'援軍',t:0,c:col(p.owner)})}}
}
// Directives: short timed objectives from high command. They set the tempo and pay out in what you lack.
const DIR_RW={gov:{l:'統治上限 +1（この銀河）',f:()=>{G.govG=(G.govG||0)+1;refreshM()}},cr:{l:'資金',f:d=>{G.fac.p.cr+=d.amt}},fcap:{l:'維持上限 +40（この銀河）',f:()=>{G.fcapBonus=(G.fcapBonus||0)+40;refreshM()}}};

  if(!d){if((G.dirT-=1)>0)return;G.dirT=rnd(60,90);
    const span=Math.max(30,H.length),kr=(G.kills-H[0][0])/span,cr=(G.stats.capt-H[0][1])/span;
    const own=G.planets.filter(p=>p.owner==='p'),busy=t=>G.ops.some(o=>o.target===t||o.front===t)||G.fleets.some(f=>f.owner==='p'&&f.to===t);
    // a real objective: a well-defended planet that is not already under attack, ideally a capital or special planet
    const cand=G.planets.filter(t=>isAI(t.owner)&&t.owner!=='void'&&seen(t)&&!busy(t)&&own.some(o=>dist(o,t)<rangeOf(o)*1.6)).sort((a,b)=>intel(b).ships*defOf(b)*(b.capital||b.trait?1.5:1)-intel(a).ships*defOf(a)*(a.capital||a.trait?1.5:1));
    const rw=Mof('p').n>=Mof('p').cap-1&&Math.random()<.6?'gov':pick(['gov','cr','cr','fcap']),amt=150+60*G.g,r=Math.random();
    if(cand.length&&r<.45){const t=cand[Math.floor(Math.min(cand.length,4)*Math.random())];G.dir={kind:'cap',target:t,t:100,rw,amt}}
    else if(r<.75)G.dir={kind:'capN',goal:clamp(Math.ceil(cr*90*1.15)+1,2,6),start:G.stats.capt,t:90,rw,amt};
    else G.dir={kind:'kill',goal:Math.round(clamp(kr*75*1.15,60+30*G.g,150+100*G.g)/10)*10,start:G.kills,t:75,rw,amt};
    news(`司令部から指令：${dirText(G.dir)}（報酬：${dirRw(G.dir)}）`,'#ffe08a');tone(700,.1,'triangle',.03,200);return}
  d.t-=1;

  else if(d.t<=0||(d.kind==='cap'&&!isAI(d.target.owner))){news('指令は期限切れになった','#8d97c7');G.dir=null}
}
const dirText=d=>d.kind==='cap'?`${Math.ceil(d.t)}秒以内に${d.target.name}（${FACS[d.target.owner]?.name||''}・${d.target.capital?'首都':d.target.trait?'特産星':'拠点'}）を制圧`:d.kind==='capN'?`${Math.ceil(d.t)}秒以内に惑星を${d.goal}つ制圧（${G.stats.capt-d.start}/${d.goal}）`:`${Math.ceil(d.t)}秒以内に敵艦を${d.goal}隻撃破（${Math.floor(G.kills-d.start)}/${d.goal}）`;
const dirRw=d=>d.rw==='cr'?`資金 +${d.amt}`:DIR_RW[d.rw].l;

/* ---------- realm-wide policies, build queue ---------- */
const isHold=p=>p.owner==='p'&&(p.hold||(G.pol.hold==='key'&&(p.capital||!!p.trait))||(G.pol.hold==='front'&&isFront(p)));
const isAuto=p=>p.owner==='p'&&(G.pol.auto==='all'||(G.pol.auto==='pick'&&p.auto));
const qCount=(p,k)=>(p.build&&p.build.k===k?1:0)+(p.queue||[]).filter(x=>x===k).length;
function canQueue(p,k){if((p.queue||[]).length>=Q_MAX)return false;const n=qCount(p,k);
  if(k==='ind')return p.ind+n<5;if(k==='def')return p.def+n<4;if(k==='turret')return!p.turret&&!n;if(k==='relay')return!p.relay&&!n;if(k==='depot')return!p.depot&&!n;if(k==='gov')return!p.gov&&!n;return false}
const buildCost=(p,k,lvOff=0)=>{const q=Object.assign({},p,{ind:p.ind+(k==='ind'?lvOff:0),def:p.def+(k==='def'?lvOff:0)});return Math.round(BUILD[k].cost(q)*Math.pow(.9,T('build')))};
function enqueue(p,k){if(!canQueue(p,k))return false;p.queue=p.queue||[];p.queue.push(k);if(!p.build)tryQueue(p);tone(500,.06,'triangle',.02,200);return true}
function tryQueue(p){if(p.build||!p.queue||!p.queue.length)return;const k=p.queue[0];if(!BUILD[k].can(p)){p.queue.shift();return tryQueue(p)}
  if(startBuild(p,k))p.queue.shift()}
// auto development: rear planets grow industry, the front fortifies, stretched supply gets a depot. Keeps a reserve for tech.
function demob(){const M=Mof('p');let ex=Math.floor(M.fleet-M.fcap),n=0;if(ex<=0)return;
  for(const p of G.planets.filter(p=>p.owner==='p'&&!isFront(p)&&!isHold(p)).sort((a,b)=>b.ships-a.ships)){if(ex<=0)break;const k=Math.min(ex,Math.floor(p.ships-2));if(k<=0)continue;p.ships-=k;ex-=k;n+=k}
  if(n){G.fac.p.cr+=n*.5;refreshM();news(`後方の${n}艦を解役した。資金 +${Math.round(n*.5)}`,'#7fd6ff');tone(420,.08,'triangle',.03)}else G.toast={txt:'後方に解役できる艦がいない（前線と防衛拠点の艦は残す）',t:2.2}}
function autoBuild(){
  const F=G.fac.p,mine=G.planets.filter(p=>p.owner==='p'),nt=TECH.filter(t=>t.cost[T(t.id)]!==undefined).map(techCost),reserve=G.pol.prod==='civ'&&nt.length?Math.max(100,Math.min(...nt)):100;
  for(const p of mine)tryQueue(p);
  if(!G.pol.build)return;
  const idle=mine.filter(p=>!p.build&&!(p.queue&&p.queue.length));if(!idle.length)return;
  const opts=[],MM=Mof('p');
  if(MM.n>MM.cap&&!mine.some(p=>qCount(p,'gov'))){const g=idle.filter(p=>!p.gov&&!isFront(p)).sort((a,b)=>b.ind-a.ind)[0]||idle.find(p=>!p.gov);if(g)opts.push([g,'gov',-1])}
  const stretched=mine.filter(p=>p.sup>=1&&!p.depot);
  if(stretched.length&&!mine.some(p=>p.build&&p.build.k==='depot')){const d=stretched.filter(p=>idle.includes(p)).sort((a,b)=>b.sup-a.sup||G.adj[b.id].length-G.adj[a.id].length)[0];if(d)opts.push([d,'depot',0])}
  for(const p of idle){const fr=isFront(p);
    if(fr){if(p.def<2)opts.push([p,'def',1+p.def]);else if(!p.turret)opts.push([p,'turret',2]);else if(p.def<4)opts.push([p,'def',3+p.def])}
    else if(p.ind<5)opts.push([p,'ind',1+p.ind])}
  opts.sort((a,b)=>a[2]-b[2]);
  for(const [p,k] of opts){if(F.cr<buildCost(p,k)+reserve)break;if(startBuild(p,k))return}
}

/* ---------- AI grand offensives (announced, so the player can prepare or strike first) ---------- */
const offCd=k=>rnd(130,190)/(FACS[k].aggr||1)*(G.rule==='war'?.6:1);
function offTick(k,dt){
  const S=G.fac[k];if(!S||!S.alive||k==='void')return;
  if(S.off){const o=S.off;o.t-=dt;
    if(o.stage.owner!==k||o.target.owner===k||!hostile(k,o.target.owner)){if(o.target.owner==='p'&&o.stage.owner!==k)news(`${FACS[k].name}の大攻勢は拠点${o.stage.name}を失って頓挫した`,'#7ff0b0');S.off=null;S.offT=offCd(k);return}
    if((o.feedT=(o.feedT||0)-dt)<=0){o.feedT=3;const {dd,par}=bfsOwn(o.stage);for(const [p,h] of dd){if(p===o.stage||h>4||p.ships<12)continue;const nx=par.get(p);if(nx&&inRange(p,nx))send(p,nx,p.ships-6,true)}}
    if(o.t<=0){let n=0;for(const p of G.planets)if(p.owner===k&&inRange(p,o.target)&&p.ships>8){send(p,o.target,p.ships*.85,true);n++}
      if(o.target.owner==='p'){news(`${FACS[k].name}の大攻勢が${o.target.name}に襲いかかる！`,'#ff5c8a');tone(110,.5,'sawtooth',.05,40)}
      S.off=null;S.offT=offCd(k)}
    return}
  if((S.offT-=dt)>0)return;
  const mine=G.planets.filter(p=>p.owner===k);let best=null,bs=1e9;
  for(const t of G.planets){if(t.owner===k||t.owner==='n'||!hostile(k,t.owner)||(t.owner==='p'&&G.rel[k]?.cease>0))continue;
    const st=mine.filter(p=>inRange(p,t));if(!st.length)continue;
    let sc=t.ships*defOf(t)-(t.capital?30:0)-(t.trait?20:0);if(t.owner==='p')sc*=G.coal?.6:.8;
    if(sc<bs){bs=sc;best=[t,st.sort((a,b)=>b.ships-a.ships)[0]]}}
  if(!best){S.offT=30;return}
  const dur=k==='raid'?30:45;S.off={target:best[0],stage:best[1],t:dur,dur};
  if(best[0].owner==='p'){news(vis(best[1])?`⚠ ${FACS[k].name}が${best[1].name}に兵を集めている。${dur}秒後に${best[0].name}へ大攻勢`:`⚠ 斥候報告：${FACS[k].name}の大軍が${best[0].name}方面に迫っている（${dur}秒後）。集結地は視界外`,'#ff5c8a');G.met.add(k);G.toast={txt:`${FACS[k].name}：${best[0].name}への大攻勢を準備中`,t:3};tone(150,.4,'sawtooth',.04,30)}
}

/* ---------- hegemony: an alternative win route through special planets ---------- */
function hegNeed(){const n=G.planets.filter(p=>p.trait).length;return Math.max(3,Math.ceil(n*.6))}
function hegemonyCheck(dt){
  const have=G.planets.filter(p=>p.trait&&p.owner==='p').length,need=hegNeed();
  if(have>=need){if(G.hegT===0){news(`特産星を${have}つ支配。${HEG_T}秒守り切れば覇権確立（銀河統一）。諸勢力が奪還に動き出した`,'#ffe08a');G.toast={txt:'覇権まで 残り'+HEG_T+'秒',t:3}}
    G.hegT+=dt;if(G.hegT>=HEG_T)galaxyCleared('heg')}
  else if(G.hegT>0){G.hegT=0;news('特産星を失い、覇権への道が途切れた','#ff5c8a')}
}

/* ---------- fog of war: you only see one hop past your borders (two with sensors) and around your fleets ---------- */
const vis=p=>!G.vis||G.vis.has(p);
const seen=p=>!G.vis||!!G.mem[p.id];
const visF=f=>!G.vis||f.owner==='p'||G.planets.some(p=>G.vis.has(p)&&Math.abs(p.x-f.x)<G.range*.8&&dist(p,f)<G.range*.8);
function remember(p){G.mem[p.id]={owner:p.owner,ships:p.ships,ind:p.ind,def:p.def,turret:p.turret,relay:p.relay,depot:p.depot,capital:p.capital,t:G.t}}
function computeVision(){
  if(G.mode!=='play'){G.vis=null;return}
  const hops=T('sensor')?2:1,v=new Set(),q=[],d=new Map();
  for(const p of G.planets)if(p.owner==='p'){d.set(p,0);q.push(p)}
  while(q.length){const c=q.shift();v.add(c);const dc=d.get(c);if(dc>=hops)continue;for(const n of G.adj[c.id])if(!d.has(n)){d.set(n,dc+1);q.push(n)}}
  for(const f of G.fleets)if(f.owner==='p')for(const p of G.planets)if(dist(p,f)<150)v.add(p);
  G.vis=v;
  for(const p of v){if(!G.mem[p.id]&&p.trait&&G.t>1)news(`探索：${p.name}に${TRAITS[p.trait].name}を発見`,'#ffe08a');remember(p);
    if(isAI(p.owner)&&!G.met.has(p.owner)){G.met.add(p.owner);if(G.t>1){news(`${FACS[p.owner].name}と接触した`,col(p.owner));G.fx.push({x:p.x,y:p.y,txt:'接触：'+FACS[p.owner].name,t:0,c:col(p.owner)})}}}
}
function propaganda(){
  for(const p of G.planets){
    if(p.owner==='p'||p.capital||!G.adj[p.id].some(n=>n.owner==='p'))continue;
    const ok=(p.owner==='n'&&p.ships<35&&Math.random()<.12)||(isAI(p.owner)&&p.sup===2&&Math.random()<.1);
    if(ok){const prev=p.owner;p.ships=Math.max(5,p.ships*.5);news(`宣伝工作：${p.name}が${prev==='n'?'':FACS[prev].name+'から'}寝返った`,'#7ff0b0');capture(p,'p');return}
  }
}

/* ---------- update ---------- */
function update(dt){
  G.t+=dt;
  if((G.mT-=dt)<=0){G.mT=.5;refreshM()}
  if((G.assignT-=dt)<=0){G.assignT=4;if(G.mode==='play'){checkCoalition();hegemonyCheck(4)}}
  if((G.supT-=dt)<=0){G.supT=1;computeSupply()}
  if((G.visT=(G.visT||0)-dt)<=0){G.visT=.25;computeVision()}

  if(G.mode==='play'&&!G.pendingEv&&(G.evT-=dt)<=0){G.evT=G.rule==='chaos'?rnd(55,85):rnd(110,170);G.pendingEv=(!G.crisis&&G.t>=G.crisisAt)?crisisEvent():rollEvent()}

    if(isAI(k)&&F.alive&&(F.tick-=dt)<=0){F.tick=rnd(2.5,4)/Math.sqrt(G.aiMul);aiTick(k)}

  if(G.mode==='play'&&(G.flowT=(G.flowT||0)-dt)<=0){G.flowT=1;flowTick()}
  if(G.launches.length)launchTick();

    for(let j=i+1;j<FL.length;j++){const b=FL[j];if(b.n<=0||a.owner===b.owner||!hostile(a.owner,b.owner)||((a.owner==='p'||b.owner==='p')&&T('stealth')))continue;

        const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;burst(mx,my,'#ffffff',8,.9);burst(mx,my,col(a.owner),6);burst(mx,my,col(b.owner),6);
        if(a.owner==='p'||b.owner==='p')tone(300,.08,'square',.02,-150);if(a.n<=0)break}}}
  for(let i=FL.length-1;i>=0;i--){const f=FL[i];

  const meAlive=G.planets.some(p=>p.owner==='p')||G.fleets.some(f=>f.owner==='p');
  const aiAlive=G.planets.some(p=>isAI(p.owner))||G.fleets.some(f=>isAI(f.owner));

}

$('info').addEventListener('click',e=>{if(e.detail===0)sideAct(e.target.closest('[data-act]'))}); // keyboard activation
function renderNews(){$('news').innerHTML=G.news.slice(0,8).map(n=>`<div><b>${n.d}</b><span style="color:${n.c}">${n.txt}</span></div>`).join('')}

/* ---------- HUD ---------- */
function setSpeed(s){G.speed=s;document.querySelectorAll('#speed button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.s===s)));$('pauseTag').hidden=!(s===0&&G.mode==='play'&&!G.modalOpen)}
document.querySelectorAll('#speed button').forEach(b=>b.onclick=()=>{if(G.mode==='play'&&!G.modalOpen){setSpeed(+b.dataset.s);if(+b.dataset.s)G.lastSpeed=+b.dataset.s}});
function setRatio(r){G.ratio=r;document.querySelectorAll('#ratio button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.r===r)))}
document.querySelectorAll('#ratio button').forEach(b=>b.onclick=()=>setRatio(+b.dataset.r));
$('bSide').onclick=()=>{document.body.classList.toggle('side-open');renderSide(true)};
const compact=()=>matchMedia('(max-height:520px) and (orientation:landscape)').matches;
function openSide(){if(compact())document.body.classList.add('side-open')}
function closeSide(){document.body.classList.remove('side-open')}
// iOS keeps audio suspended until a user gesture resumes it
addEventListener('pointerdown',()=>{try{if(!actx&&!muted)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx&&actx.state==='suspended')actx.resume()}catch(e){}},{capture:true});
$('bMute').onclick=()=>{muted=!muted;$('bMute').textContent=muted?'♪×':'♪'};
$('bHome').onclick=()=>{if(G.mode==='play')focusHome()};
const canModal=()=>G.mode==='play'&&!G.modalOpen;
$('bTech').onclick=()=>{if(canModal())openModal('tech')};
$('bMenu').onclick=()=>{if(canModal())openModal('menu')};
addEventListener('keydown',e=>{
  if(G.mode!=='play'||G.modalOpen)return;
  if(e.key===' '){e.preventDefault();setSpeed(G.speed?0:(G.lastSpeed||1))}
  else if(e.key>='1'&&e.key<='3'){setSpeed(+e.key);G.lastSpeed=+e.key}
  else if(e.key==='Escape'){G.sel.clear();G.focus=null;renderSide(true)}
  else if(e.key.toLowerCase()==='h')focusHome();
});
let lastHud='';
function setDot(id,n){const b=$(id);let d=b.querySelector('.dot');if(n){if(!d){d=document.createElement('span');d.className='dot';b.appendChild(d)}d.textContent=n}else if(d)d.remove()}
function updHud(){
  const pl=G.planets.filter(p=>p.owner==='p'),inc=pl.reduce((a,p)=>a+incOf(p),0)+(G.convR||0),M=Mof('p');
  const ships=Math.round(pl.reduce((a,p)=>a+p.ships,0)+G.fleets.reduce((a,f)=>a+(f.owner==='p'?f.n:0),0));
  const v=G.mode==='title'?['-','-','-','-',best?'BEST '+best.toLocaleString():'0']:[`${G.g}-${Math.floor(G.t)}`,`${Math.floor(G.fac.p?.cr||0)}<em style="color:${inc-M.up<0?'#ff5c8a':'var(--heal)'}">${inc-M.up<0?'':'+'}${(inc-M.up).toFixed(1)}/s</em>`,`${M.n}/${M.cap}`,`${ships}<em style="color:${ships>M.fcap?'#ffb347':'var(--mute)'}">/${M.fcap}</em>`,G.score.toLocaleString()];
  const s=v.join('|')+G.coal;if(s!==lastHud){lastHud=s;['hDay','hCr','hPl','hShips','hScore'].forEach((id,i)=>$(id).innerHTML=v[i]);$('hPl').classList.toggle('over',G.mode!=='title'&&M.n>M.cap)}
  const play=G.mode==='play';
  setDot('bTech',play&&TECH.some(t=>t.cost[T(t.id)]!==undefined&&G.fac.p.cr>=techCost(t))?'!':0);
  $('coalTag').hidden=!(G.coal&&play);
}

/* ---------- modals ---------- */
function showOverlay(html){ov.innerHTML=html;ov.hidden=false;ov.scrollTop=0}
function hideOverlay(){ov.hidden=true;ov.innerHTML=''}
function openModal(type,data){
  if(!G.modalOpen){G.modalOpen=true;G.resume=G.speed;G.speed=0;$('pauseTag').hidden=true}
  const close=()=>{G.modalOpen=false;hideOverlay();setSpeed(G.mode==='play'?G.resume:0);renderSide(true);updHud()};
  if(type==='tech'){
    showOverlay(`<div class="panel"><p class="kicker">TECHNOLOGY</p><h2>技術開発 <span style="color:var(--gold)">資金 ${Math.floor(G.fac.p.cr)}</span></h2>
      <p class="muted">この戦役の間ずっと有効で、次の銀河にも引き継ぎます。上のボタンに「!」が付いたら開発できる技術があります。${Mof('p').tcost<1?`古代遺跡の効果で費用 -${Math.round((1-Mof('p').tcost)*100)}%。`:''}</p>
      <p class="sec">基礎技術（数値を伸ばす）</p><div class="grid2">${TECH.filter(t=>!t.brk).map(t=>{const lv=T(t.id),c=t.cost[lv]!==undefined?techCost(t):undefined;return `<div class="item"><strong>${t.name}</strong><span>${t.desc}（Lv ${lv}/${t.cost.length}）</span>
        <div class="pips t">${t.cost.map((_,i)=>`<i class="${i<lv?'on':''}"></i>`).join('')}</div>
        ${c!==undefined?`<button class="buy t" data-t="${t.id}" ${G.fac.p.cr<c?'disabled':''}>${c} 資金で開発</button>`:'<span style="color:var(--gold)">完成</span>'}</div>`}).join('')}</div>
      <p class="sec">突破技術（戦い方そのものを変える・1回きり）</p><p class="muted" style="font-size:13px">高価なので全部は取れない。どれを取るかで、その戦役の戦い方が決まります。</p><div class="grid2">${TECH.filter(t=>t.brk).map(t=>{const done=T(t.id)>0,c=done?0:techCost(t);return `<div class="item" style="${done?'border-color:var(--gold)':''}"><strong>${t.name}</strong><span>${t.desc}</span>
        ${done?'<span style="color:var(--gold)">取得済み</span>':`<button class="buy t" data-t="${t.id}" ${G.fac.p.cr<c?'disabled':''}>${c} 資金で開発</button>`}</div>`}).join('')}</div>
      <button class="cta" id="mB">閉じる</button></div>`);
    ov.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=TECH.find(t=>t.id===b.dataset.t);if(t.cost[T(t.id)]===undefined)return;const c=techCost(t);if(G.fac.p.cr<c)return;G.fac.p.cr-=c;G.tech[t.id]=T(t.id)+1;G.stats.tb=1;refreshM();news(`技術「${t.name}」Lv${G.tech[t.id]}を開発`,'#ffe08a');tone(880,.12,'triangle',.03,400);openModal('tech')});
    $('mB').onclick=close;
  }else if(type==='event'){const ev=data;
    showOverlay(`<div class="panel"><p class="kicker">GALACTIC EVENT · 宇宙暦 ${Math.floor(G.t)}</p><h2>${ev.title}</h2><p>${ev.text}</p>
      <div class="off-list">${ev.ch.map((c,i)=>`<button class="toggle" id="ev${i}" ${c.ok&&!c.ok()?'disabled':''}><span>${c.l}<small>${c.s}</small></span></button>`).join('')}</div></div>`);
    ev.ch.forEach((c,i)=>$('ev'+i).onclick=()=>{if(c.ok&&!c.ok())return;c.f();refreshM();computeSupply();updHud();close()});
  }else if(type==='menu'){
    showOverlay(`<div class="panel"><p class="kicker">MENU</p><h2>一時停止中</h2><p class="muted">第${G.g}銀河 ・ スコア ${G.score.toLocaleString()} ・ 宇宙暦 ${Math.floor(G.t)}</p>
      <button class="cta" id="mB">戻る</button><button class="cta ghost" id="mA">戦役を終える（星屑は受け取れます）</button></div>`);
    $('mB').onclick=close;$('mA').onclick=()=>{G.modalOpen=false;gameOver(true)};
  }
}
function galaxyCleared(kind){
  if(G.mode!=='play')return;achCheck(kind||'all');G.mode='cleared';G.speed=0;$('pauseTag').hidden=true;$('coalTag').hidden=true;const tb=Math.max(0,Math.round((600-G.t)*3*G.g)),gain=2000*G.g+tb;G.score+=gain;G.stats.galaxies++;saveBest();renderSide(true);updHud();
  showOverlay(`<div class="panel"><p class="kicker">${kind==='heg'?'HEGEMONY':'GALAXY UNIFIED'}</p><h2>第${G.g}銀河「${GAL[(G.g-1)%GAL.length]}」${kind==='heg'?'覇権確立':'統一'}</h2>${kind==='heg'?'<p class="muted">特産星を押さえ、守り切った。残る勢力はあなたの覇権を認めた。</p>':''}
    <dl class="tally"><dt>統一ボーナス</dt><dd>+${(2000*G.g).toLocaleString()}</dd><dt>速攻ボーナス（宇宙暦 ${Math.floor(G.t)}）</dt><dd>+${tb.toLocaleString()}</dd><dt class="total">スコア</dt><dd class="total">${G.score.toLocaleString()}</dd></dl>
    <p class="muted">次の銀河はさらに広く、敵勢力も増えて強くなります。技術と資金の半分を引き継いで進軍します。勝ち方は自由：制覇でも覇権でも。</p>
    <button class="cta" id="mA">次の銀河へ</button></div>`);
  $('mA').onclick=()=>{const cr=Math.floor(G.fac.p.cr/2);G.g++;G.t=0;
    if(TR('techlock'))for(const t of TECH)if(!t.brk&&T(t.id)>0)G.tech[t.id]--;
    startGalaxy();G.fac.p.cr=cr+150;news(`第${G.g}銀河「${GAL[(G.g-1)%GAL.length]}」へ進軍`,'#7fd6ff');
    const lords=Object.keys(G.fac).filter(k=>G.fac[k].lord);if(lords.length)news(`覇王勢力：${lords.map(k=>FACS[k].name).join('・')}（生産 ×1.4・攻防 ×1.15・堅固な首都）。滅ぼせばスコア3倍`,'#ff5c8a');achCheck()};
}
function saveBest(){if(G.score>best){best=G.score;try{localStorage.setItem('orbitSiegeBest3',best)}catch(e){}return true}return false}
function gameOver(quit,why){
  G.mode='over';G.speed=0;$('pauseTag').hidden=true;$('coalTag').hidden=true;const raw=G.score;G.score=Math.round(G.score*hmul());const rec=saveBest();
  const dust=Math.floor((raw/100+G.stats.destroyed*5+G.stats.capitals*3+G.stats.galaxies*20+G.g*3)*(1+.1*meta.lv.dust)*hmul());meta.dust+=dust;
  const h=heat();meta.hb=meta.hb||{};if(G.g>(meta.hb[h]||0))meta.hb[h]=G.g;saveMeta();
  renderSide(true);updHud();
  showOverlay(`<div class="panel"><p class="kicker">CAMPAIGN OVER</p><h2>${quit?'戦役を終えた':why||'全ての拠点を失った'}</h2><p class="muted">教義「${DOCS[G.doc||'none'].name}」・試練 ${heat()}${heat()?`（スコア・星屑 ×${hmul().toFixed(2)}）`:''}</p>${rec?'<p style="color:var(--gold);font-family:var(--display);letter-spacing:.14em">NEW RECORD</p>':''}
    <dl class="tally"><dt>到達</dt><dd>第${G.g}銀河 · 宇宙暦 ${Math.floor(G.t)}</dd><dt>制圧した惑星</dt><dd>${G.stats.capt}</dd><dt>攻略した首都</dt><dd>${G.stats.capitals}</dd><dt>滅ぼした勢力</dt><dd>${G.stats.destroyed}</dd>
      <dt class="total">スコア</dt><dd class="total">${G.score.toLocaleString()}</dd><dt>ベスト</dt><dd>${best.toLocaleString()}</dd><dt class="dust">獲得した星屑</dt><dd class="dust">+✦ ${dust}</dd></dl>
    <div class="row"><button class="cta" id="mA">新しい戦役へ</button><button class="cta alt" id="mL">研究所 ✦${meta.dust}</button></div><button class="btn" id="mT">タイトルへ</button></div>`);
  $('mA').onclick=newCampaign;$('mL').onclick=()=>{titleScreen();labScreen()};$('mT').onclick=titleScreen;
}
function titleScreen(){
  G.mode='title';G.speed=1;G.modalOpen=false;$('pauseTag').hidden=true;G.news=[];renderNews();renderSide(true);lastHud='';demo();updHud();
  showOverlay(`<div class="panel"><p class="kicker">REAL-TIME GALACTIC CONQUEST</p><h1>STARMARCH</h1>
    <ul class="rules">
      <li>時間は流れ続ける。<b>右上の II（または Space）で一時停止</b>しても命令できる</li>
      <li>スマホ：<b>ダブルタップ</b>はダブルクリックと同じ。<b>惑星を長押しで詳細</b>、右上の<b>「指揮」</b>で全体方針・作戦・建設を開く。2本指で拡大縮小</li>
      <li><b>見えているのは自軍の隣の惑星まで</b>。敵の位置も特産星も航路も、広げるか艦隊を送るまでわからない。見えない惑星は最後に見た姿のまま</li>
      <li>自軍惑星（水色）からドラッグして出撃、<b>なぞると一斉出撃</b>。届くのは隣の惑星まで</li>
      <li><b>敵惑星をダブルクリックで作戦</b>：周りの惑星が自動で艦を集め、経路上を順に落として攻め進む。<b>自軍惑星をダブルクリックで防衛拠点</b></li>
      <li>右の<b>全体方針</b>で、後方輸送・防衛拠点・自動内政を一括で決める。建設は押すだけで予約に積まれる</li>
      <li><b>維持上限</b>：上限を超えて艦を抱えると維持費がかかる（生産と後方輸送は止まらない）。上限は惑星を増やしてもほとんど増えないので、溜め込むより、どこに集めていつ使うかの勝負</li>
      <li><b>数で劣っても勝てる</b>：別々の惑星から同時に着弾させる<b>挟撃</b>は攻撃 ×1.35。<b>突破技術</b>（シールド・遮蔽・軌道砲・宣伝工作など）で戦い方そのものを変えられる</li>
      <li>敵は<b>大攻勢を予告</b>してくる。守りを固めるか、集結地を先に叩くか。<b>補給線</b>を断てば戦わずに弱らせられる</li>
      <li>勝ち筋は2つ：全勢力を倒す<b>制覇</b>か、特産星（金の輪）を押さえて守り切る<b>覇権</b></li>
      <li>中盤には<b>虚空の侵略</b>や<b>銀河の事件</b>。統一すればさらに広い次の銀河へ。終わりなし</li>
    </ul>
    <div class="row"><button class="cta" id="mA">戦役を始める</button><button class="cta alt" id="mL">研究所 ✦${meta.dust}</button><button class="cta alt" id="mH">勲章 ${Object.keys(meta.ach||{}).length}/${ACH.length}</button></div>
    ${Object.keys(meta.hb||{}).length?`<p class="muted" style="text-align:center">最高到達：${Object.entries(meta.hb).sort((a,b)=>b[0]-a[0]).slice(0,3).map(([h,g])=>`試練${h}で第${g}銀河`).join('・')}</p>`:''}
    ${best?`<p class="kicker">BEST ${best.toLocaleString()}</p>`:''}</div>`);
  $('mA').onclick=setupScreen;$('mL').onclick=labScreen;$('mH').onclick=achScreen;
}
let setup={doc:'none',tr:new Set()};
function setupScreen(){
  const h=[...setup.tr].reduce((a,k)=>a+TRIALS[k].h,0);
  showOverlay(`<div class="panel"><p class="kicker">CAMPAIGN SETUP</p><h2>戦役の準備</h2>
    <p class="sec">教義（国の性格を1つ選ぶ）</p><div class="grid2">${Object.entries(DOCS).map(([k,d])=>`<button class="item" data-doc="${k}" style="text-align:left;cursor:pointer;${setup.doc===k?'border-color:var(--gold)':''}"><strong>${setup.doc===k?'● ':''}${d.name}</strong><span>${d.desc}</span></button>`).join('')}</div>
    <p class="sec">試練（自分に課す縛り。合計が高いほどスコアと星屑が増える）</p><div class="grid2">${Object.entries(TRIALS).map(([k,t])=>`<button class="item" data-tr="${k}" style="text-align:left;cursor:pointer;${setup.tr.has(k)?'border-color:#ff5c8a':''}"><strong>${setup.tr.has(k)?'✔ ':''}${t.name} <small style="color:#ff5c8a">試練 +${t.h}</small></strong><span>${t.desc}</span></button>`).join('')}</div>
    <p class="muted" style="text-align:center">試練の合計 <b style="color:#ff5c8a">${h}</b> · スコア・星屑 ×${(1+.15*h).toFixed(2)}${meta.hb&&meta.hb[h]?` · この試練での最高到達 第${meta.hb[h]}銀河`:''}</p>
    <div class="row"><button class="cta" id="mA">出撃</button><button class="cta alt" id="mB">戻る</button></div></div>`);
  ov.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>{setup.doc=b.dataset.doc;setupScreen()});
  ov.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{const k=b.dataset.tr;setup.tr.has(k)?setup.tr.delete(k):setup.tr.add(k);setupScreen()});
  $('mA').onclick=()=>{G.mode='starting';newCampaign();tone(440,.1,'triangle',.03,440)};$('mB').onclick=titleScreen;
}
function achScreen(){meta.ach=meta.ach||{};
  showOverlay(`<div class="panel"><p class="kicker">MEDALS</p><h2>勲章 ${Object.keys(meta.ach).length}/${ACH.length}</h2><p class="muted">獲得すると星屑がもらえます。</p>
    <div class="grid2">${ACH.map(a=>`<div class="item" style="${meta.ach[a.id]?'border-color:#c9a8ff':'opacity:.6'}"><strong>${meta.ach[a.id]?'★ ':'☆ '}${a.name}</strong><span>${a.desc}（✦${a.r}）</span></div>`).join('')}</div>
    <button class="cta" id="mB">戻る</button></div>`);$('mB').onclick=titleScreen}
function labScreen(){
  showOverlay(`<div class="panel"><p class="kicker">RESEARCH LAB</p><h2>研究所 <span style="color:var(--dust)">✦ ${meta.dust}</span></h2>
    <p class="muted">ずっと残る強化です。効果は控えめで、戦役ごとの判断と技術開発が主役です。</p>
    <div class="grid2">${LAB.map(l=>{const lv=meta.lv[l.id],max=l.cost.length,c=l.cost[lv];return `<div class="item"><strong>${l.name}</strong><span>${l.desc}：<b style="color:var(--ink)">${l.eff(lv)}</b>${lv<max?` → ${l.eff(lv+1)}`:''}</span>
      <div class="pips">${Array.from({length:max},(_,i)=>`<i class="${i<lv?'on':''}"></i>`).join('')}</div>
      ${lv<max?`<button class="buy" data-l="${l.id}" ${meta.dust<c?'disabled':''}>✦ ${c} で強化</button>`:'<span style="color:var(--dust)">最大レベル</span>'}</div>`}).join('')}</div>
    <button class="cta" id="mB">戻る</button></div>`);
  ov.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const l=LAB.find(l=>l.id===b.dataset.l),c=l.cost[meta.lv[l.id]];if(meta.dust<c)return;meta.dust-=c;meta.lv[l.id]++;saveMeta();labScreen()});
  $('mB').onclick=titleScreen;
}
// title backdrop: an AI-only galaxy fighting itself
function demo(){if(!W)return;G.g=2;G.t=0;G.tech={};G.fleets=[];G.ops=[];genGalaxy();G.planets.forEach(p=>{if(p.owner==='p')p.owner='raid'});G.fac.p={cr:0,tick:0,autoT:9e9,alive:false};
  refreshM();computeSupply();G.focus=null;G.sel.clear();G.cam.z=zMin()*1.05;G.cam.x=G.WW/2;G.cam.y=G.WH/2}

/* ---------- loop ---------- */
let last=performance.now(),sideT=0;
function frame(now){
  artTick(now);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G.mode==='play'){
    if(G.speed>0)update(dt*G.speed);
    if(G.mode==='play'&&G.pendingEv&&!G.modalOpen){const ev=G.pendingEv;G.pendingEv=null;openModal('event',ev)}
    if((sideT-=dt)<=0){sideT=.2;renderSide();updHud()}
  }else if(G.mode==='title'&&G.planets.length)update(dt*.8);
  if(G.toast&&(G.toast.t-=dt)<=0)G.toast=null;
  for(let i=G.fx.length-1;i>=0;i--)if((G.fx[i].t+=dt)>1.4)G.fx.splice(i,1);
  for(let i=G.parts.length-1;i>=0;i--){const q=G.parts[i];q.life-=dt;if(q.life<=0){G.parts.splice(i,1);continue}q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.94;q.vy*=.94}
  for(const p of G.planets)if(p.flash>0)p.flash-=dt*1.5;
  draw(now);requestAnimationFrame(frame);
}
resize();
setTimeout(()=>{resize();titleScreen()},0);
requestAnimationFrame(frame);
})();
</script>
